# IntentAgent 技能目录。
# 每个技能由 lc_tools.build_skill_tools 挂成 load_<id> 工具，description 即
# 模型看到的工具说明 —— 它是模型判断「要不要读这篇」的唯一依据，所以写具体些。
skills:
  - id: core_intent
    title: 自主意图核心
    description: 角色、强制原则、工具列表与输出字段总纲
    file: core_intent.md

  - id: time_parsing
    title: 时间解析细则
    description: 相对/绝对时间的归一化、timeRange 与 timeParseError 写法；问题含日期、时段、昨天/上周/上下午等表达时读
    file: time_parsing_rules.md

  - id: multi_target
    title: 多目标拆分
    description: 多个舷号或描述并列（顿号、逗号、和/与/及）时如何填 targetItems
    file: multi_target.md

  - id: target_identity
    title: 目标与操作类型
    description: targetScope / targetKind / operation / registryRelation 的判定
    file: target_identification_rules.md

  - id: acceptance_fields
    title: 验收字段填写
    description: expectedOutcome / successCriteria / nextAgentFocus 怎么写，含分阶段存在判断
    file: acceptance_fields.md

  - id: registry_scope
    title: 数据库范围识别
    description: 识别数据库、先验库、名录等限定词，阻止纯数据库问题越界到视频检索
    file: registry_scope.md
