# PlanAgent 技能目录。
# 每个技能由 lc_tools.build_skill_tools 挂成 load_<id> 工具，description 即
# 模型看到的工具说明 —— 它是模型判断「要不要读这篇」的唯一依据，所以写具体些。
skills:
  - id: core_planning
    title: 自主规划核心
    description: 角色、最小可执行计划原则与输出格式
    file: core_planning.md

  - id: tool_chains
    title: 工具链路与参数
    description: 允许的工具、典型链路、参数与 $ref 要点
    file: tool_planning_rules.md

  - id: recovery
    title: 失败修复与补洞
    description: 计划校验失败、证据缺口时如何改计划；上轮失败或 Reflect 要求 replan 补洞时读
    file: recovery.md

  - id: acceptance_focus
    title: 验收驱动规划
    description: 按 pendingRequirements / nextAgentFocus 排优先级；存在验收进度或下一焦点时读
    file: acceptance_focus.md

  - id: registry_query
    title: 纯数据库查询规划
    description: 数据库描述、舷号、列表与数量查询的最小工具链及证据边界；targetScope=registry 或问题限定数据库时读
    file: registry_query.md
