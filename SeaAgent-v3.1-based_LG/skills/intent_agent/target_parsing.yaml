# 多目标解析规则（替代 tools/target_parser.py 内硬编码）

query_words:
  - 查
  - 找
  - 有没有
  - 是否
  - 出现
  - 存在
  - 列出

# 目标分隔（正则）：标点 或 并列连词（连词两侧空格可选）
split_pattern: "[，,、；;]+|\\s*(?:和|及|以及)\\s*"

# 去掉句首请求语
leading_pattern: "^(?:请|麻烦|帮我|帮忙)?\\s*(?:查找|查一下|找一下|帮我查一下|帮我找一下|帮我找|查询|寻找)\\s*"

# 去掉句尾问询尾巴
trailing_pattern: "(?:是否(?:已经)?(?:出现|存在)(?:[／/或](?:出现|存在))?|有没有(?:出现|存在)?|是否出现过|是否存在过|出现了吗|存在吗|出现过|存在)?\\s*[？?。！!]*$"

# 舷号形态（允许中文船名+编号，如 小蓝320）
hull_pattern: "[0-9A-Za-z\\u4e00-\\u9fff-]{2,16}$"

# 去掉「第 N 艘」前缀
ordinal_prefix_pattern: "^(?:第\\s*\\d+\\s*(?:艘|条|只)\\s*)"

# 去掉「舷号:」前缀
hull_label_prefix_pattern: "^(?:舷号|弦号)\\s*[:：]?\\s*"

# 切分后清洗用的两端标点
trim_chars: " \t\r\n：:，,、；;。！？?!"
