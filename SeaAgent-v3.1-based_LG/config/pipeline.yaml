pipeline:
  max_parallel_pipelines: 1
  # 候选帧抽样间隔（越大越不卡；识别仍异步）
  candidate_every_n_frames: 15
  candidate_pool_size: 8
  keyframe_pool_size: 6
  max_stale_frames: 120
  recognition_workers: 3
  recognition_timeout_seconds: 45
  min_crop_width: 80
  min_crop_height: 80
  # 监控推流写盘间隔（帧）；每帧写盘会造成周期性卡顿
  stream_write_every_n_frames: 2
  stream_jpeg_quality: 65
  target_fps: 0
  pipe_scale: 0.25
  max_frames: 0
  save_output_video: true
  demo: true
  quality:
    min_score: 0.20
    sharpness_reference: 180.0
    size_min: 0.04
    size_max: 0.35
  retention:
    readable_bonus: 1.0
    confidence_weight: 0.70
    quality_weight: 0.30
    min_time_gap_seconds: 30.0
    replace_margin: 0.05
  aggregation:
    null_weight: 0.333333
    conflict_margin: 0.15
    confirmed_support: 1.50
    confirmed_count: 2
    null_margin: 0.30
  retrieval:
    top_k: 3
    # 广泛多库、多轨迹图像匹配；0 表示不截断
    broad_match_top_k: 0
    text_match: 0.62
    text_exclude: 0.42
    image_match: 0.72
    image_exclude: 0.52
    dedup_high: 0.82
    dedup_low: 0.72
  evidence:
    clip_width: 640
    clip_height: 360
    clip_fps: 15
    clip_crf: 31
    poster_quality: 75
  agent:
    max_rounds: 5
    display_limit: 3
