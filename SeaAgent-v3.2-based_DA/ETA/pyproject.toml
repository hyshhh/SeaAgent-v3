[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seaagent-eta"
version = "0.1.0"
description = "SeaAgent 的可复现 ETA/DPD 训练模块"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.2",
  "faiss-cpu>=1.8",
  "httpx>=0.25",
  "opencv-python>=4.8",
]

[project.scripts]
seaagent-eta = "eta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
