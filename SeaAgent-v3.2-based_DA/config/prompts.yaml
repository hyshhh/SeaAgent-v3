prompts:
  single_frame_recognition: |
    Inspect one cropped vessel. Read a hull number only when legible; otherwise use null. Return JSON with exactly:
    has_readable_hull_number (yes/no), vlm_hull_number (normalised string or null), readability_confidence (0–1),
    description (short English phrase covering stable colour, type, superstructure and fixed structures).
  text_retrieval_instruction: Match the vessel by visible appearance, especially colour, type, superstructure and fixed equipment.
  verify_images: |
    Compare the first image (known vessel) with the second image (candidate). Decide whether they show the same vessel.
    Compare hull outline, paint, superstructure, fixed equipment and any legible hull number. Allow viewpoint, scale,
    lighting and occlusion changes. Use mismatch only for clear structural conflict; use uncertain when evidence is weak
    or only colour is similar. Return JSON only: {"decision":"match|mismatch|uncertain","facts":["visible facts"]}.
