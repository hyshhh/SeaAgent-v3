tools:
  - name: recognize_tracks
    label: 直接识别
    description: >-
      在轨迹记忆内部完成舷号、目标名称/别名、外观描述或图片检索。用户用名称指代目标（如“小红”）时填 hull_number；纯外观描述用 description。
      先验库比对按“轨迹—库实体”只取最高单帧余弦相似度，不做多帧平均。
      省略 time_range 表示全部监控时间；有时间段时只搜该范围。
      返回 status、少量候选及 coverageComplete；候选含 scoreBand、分数、时间和证据 ID，不返回原始轨迹。
      灰区最多返回前 5 条供 VLM 核验，其余灰区候选按非灰区处理。
      图片路径不可用或图片编码失败时会返回工具错误，不能将工具错误当作未匹配。
      舷号/别名未确认时返回 nextStep=match_registry_tracks 和 recommendation；直查 mismatch 不代表目标不存在，应用相同舷号、时间范围辅助核验。描述或图片检索有可核验的不确定候选时返回 nextStep=verify_vessel_images。
      候选提供 matchedKeyframeId，供 VLM 核验实际命中的关键帧；覆盖不完整时不得把无候选说成未出现。
    arguments:
      hull_number: {type: string, required: false, description: 可选舷号或目标别名；纯外观描述请用 description。}
      description: {type: string, required: false, description: 可选外观描述，例如颜色、船型和固定结构。}
      image_path: {type: string, required: false, description: 可选本地图片路径，只用于图像相似检索。}
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]；单日包含整天；省略表示全部监控时间。"}
      top_k: {type: integer, required: false, default: 6, description: 返回候选上限，工具会再次限制。}

  - name: match_registry_tracks
    label: 先验库辅助识别
    description: >-
      仅用于用户提供的舷号或目标名称/别名。工具内部查找对应先验库参考图，并与范围内轨迹关键帧做视觉 embedding 比对；
      自动完成分页、视觉匹配和覆盖统计，只返回 status、少量候选和证据 ID。候选含 matchedKeyframeId、matchedRegistryReferenceId；
      灰区最多返回前 5 条供 VLM 核验，其余按非灰区处理；有候选时返回 nextStep=verify_vessel_images。库中有记录不等于视频出现。
    arguments:
      hull_number: {type: string, required: true, description: 要比对的舷号或别名。}
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]；单日包含整天；省略表示全部监控时间。"}
      top_k: {type: integer, required: false, default: 6, description: 返回候选上限。}

  - name: verify_vessel_images
    label: VLM 候选核验
    description: >-
      只核验一个已召回的轨迹候选或一对待去重轨迹，不搜索轨迹。参考证据四选一：用户图片 reference_image、
      用户描述 reference_description、先验库图片 reference_registry_reference_id、轨迹关键帧 reference_keyframe_id；
      候选证据二选一：candidate_image 或候选关键帧 candidate_keyframe_id。
      识别、先验库统计和去重候选均逐条调用。返回 pairId、trackId、decision（match、mismatch 或 uncertain）及最多三条依据；
      证据不足或只有颜色相似时返回 uncertain。
      若模型 JSON 格式异常但 decision 唯一明确，会标记 formatRecovered=true 且不返回依据；歧义结果仍报错。
    arguments:
      reference_image: {type: string, required: false, description: 用户提供的参考图片路径；与另外两种 reference 参数互斥。}
      reference_description: {type: string, required: false, description: 用户原始外观描述；与其他 reference 参数互斥。}
      reference_registry_reference_id: {type: string, required: false, description: 先验库辅助识别结果中的 matchedRegistryReferenceId；与其他 reference 参数互斥。}
      reference_keyframe_id: {type: string, required: false, description: 去重候选中的 referenceKeyframeId；与其他 reference 参数互斥。}
      candidate_image: {type: string, required: false, description: 待核验图片的本地路径；与 candidate_keyframe_id 二选一。}
      candidate_keyframe_id: {type: string, required: false, description: 候选的 matchedKeyframeId；与 candidate_image 二选一。}
      pair_id: {type: string, required: false, description: 去重候选的稳定 pairId，用于把 VLM 结果关联回轨迹对。}

  - name: dedup_tracks
    label: 轨迹去重统计
    description: >-
      两阶段轨迹去重。首次调用返回 duplicateCandidates、duplicateCandidateCount、fuzzyShipCount、
      低阈值到复核阈值为模糊匹配，复核阈值到高阈值为精确匹配灰区，高阈值以上直接精确匹配。
      只有灰区 duplicateCandidates 需要逐对调用 VLM；status=verification_required 和 nextStep=verify_vessel_images。
      灰区最多返回前 12 对供 VLM 核验，其余轨迹对不进入精确合并。
      VLM match 的 pairId 作为 confirmedPairIds，VLM match/mismatch 的 pairId 作为 resolvedPairIds，再次调用本工具收尾。
      收尾返回 exactShipCount 与 fuzzyShipCount；exact 合并高阈值直接匹配和 VLM 确认的灰区轨迹对，fuzzy 使用低阈值 embedding 分组。
      省略 time_range 表示全部监控时间；显式范围返回实际使用的 appliedTimeRange，供核对。
    arguments:
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]；单日包含整天。"}
      confirmed_pair_ids: {type: string_list, required: false, description: 首次调用后 VLM decision=match 的 pairId 列表。}
      resolved_pair_ids: {type: string_list, required: false, description: 首次调用后 VLM decision=match 或 mismatch 的 pairId 列表。}

  - name: match_entities
    label: 实体先验库匹配统计
    description: >-
      仅用于用户明确询问“在库船数量/不在库船数量”的统计入口；不得用于舷号、描述或图片识别题。不去重；逐轨迹与先验库做 embedding 检索，每个“轨迹—库实体”只取最高单帧余弦相似度，不做多帧平均，且不在工具内部调用 VLM。
      score ≥ image_match 直接计为在库；score ≤ image_exclude 直接计为不在库；仅灰区返回待核验候选。
      返回 trackCount、embeddingConfirmedCount、outsideRegistryCount、grayCandidateCount、unresolvedTrackCount、embeddingCoverageComplete、
      coverageReasons、appliedTimeRange，以及最多 12 个 verificationCandidates；其余灰区轨迹直接计入不在库。
      有候选时返回 status=verification_required、nextStep=verify_vessel_images 和 recommendation；
      Agent 只需对灰区候选使用 matchedRegistryReferenceId + matchedKeyframeId 调用 verify_vessel_images；多个候选可在同一回合批量提出，运行器允许最多 5 个 VLM 核验并发执行，其他工具保持串行。
      灰区 VLM match 计为在库，VLM mismatch 计为不在库，uncertain/失败保持未解决。
      灰区核验完成后统一计算：总数 = trackCount；在库船 = embeddingConfirmedCount + VLM match；不在库船 = 总数 - 在库船。
      两类问题最终都说明同一组结果：总数、在库船、不在库船；outsideRegistryCount 只作诊断，不可替代“总数 - 在库船”。
      省略 time_range 表示全部监控时间；显式范围返回实际使用的 appliedTimeRange。
    arguments:
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]；单日包含整天。"}

  - name: show_evidence
    label: 证据与统计
    description: >-
      按轨迹汇总本轮证据。界面每条轨迹一行显示 ID、出现时间和该轨迹的第一张关键帧；仅在调用 match_entities 后显示先验库匹配结果。
    arguments:
      track_ids: {type: string_list, required: false, description: 识别结果中的轨迹 ID。}
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]。"}
      max_items: {type: integer, required: false, default: 6, description: 最多展示的轨迹数。}
