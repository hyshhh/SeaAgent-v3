tools:
  - name: recognize_tracks
    label: 直接识别
    description: >-
      在轨迹记忆内部完成舷号、目标名称/别名、外观描述或图片检索。用户用名称指代目标（如“小红”）时填 hull_number；纯外观描述用 description。
      省略 time_range 表示全部监控时间；有时间段时只搜该范围。
      返回 status、少量候选及 coverageComplete；候选含 scoreBand、分数、时间和证据 ID，不返回原始轨迹。
      图片路径不可用或图片编码失败时会返回工具错误，不能将工具错误当作未匹配。
      舷号/别名未确认时返回 nextStep=match_registry_tracks；描述或图片检索有可核验的不确定候选时返回 nextStep=verify_vessel_images。
      候选提供 matchedKeyframeId，供 VLM 核验实际命中的关键帧；覆盖不完整时不得把无候选说成未出现。
    arguments:
      hull_number: {type: string, required: false, description: 可选舷号或目标别名；纯外观描述请用 description。}
      description: {type: string, required: false, description: 可选外观描述，例如颜色、船型和固定结构。}
      image_path: {type: string, required: false, description: 可选本地图片路径，只用于图像相似检索。}
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]；单日包含整天；省略表示全部监控时间。"}
      top_k: {type: integer, required: false, default: 6, description: 返回候选上限，工具会再次限制。}

  - name: match_registry_tracks
    label: 先验库辅助识别
    description: >-
      仅用于用户提供的舷号或目标名称/别名。工具内部查找对应先验库参考图，并与范围内轨迹关键帧做视觉 embedding 比对；
      自动完成分页、视觉匹配和覆盖统计，只返回 status、少量候选和证据 ID。候选含 matchedKeyframeId、matchedRegistryReferenceId；
      有可核验的不确定候选时返回 nextStep=verify_vessel_images。库中有记录不等于视频出现。
    arguments:
      hull_number: {type: string, required: true, description: 要比对的舷号或别名。}
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]；单日包含整天；省略表示全部监控时间。"}
      top_k: {type: integer, required: false, default: 6, description: 返回候选上限。}

  - name: verify_vessel_images
    label: VLM 候选核验
    description: >-
      只核验一个已召回的轨迹候选，不搜索轨迹。参考证据三选一：用户图片 reference_image、用户描述 reference_description、
      先验库图片 reference_registry_reference_id；候选证据二选一：candidate_image 或候选的 matchedKeyframeId。
      对不确定候选逐个调用。返回 decision（match、mismatch 或 uncertain）及最多三条依据；证据不足或只有颜色相似时返回 uncertain。
      若模型 JSON 格式异常但 decision 唯一明确，会标记 formatRecovered=true 且不返回依据；歧义结果仍报错。
    arguments:
      reference_image: {type: string, required: false, description: 用户提供的参考图片路径；与另外两种 reference 参数互斥。}
      reference_description: {type: string, required: false, description: 用户原始外观描述；与另外两种 reference 参数互斥。}
      reference_registry_reference_id: {type: string, required: false, description: 先验库辅助识别结果中的 matchedRegistryReferenceId；与另外两种 reference 参数互斥。}
      candidate_image: {type: string, required: false, description: 待核验图片的本地路径；与 candidate_keyframe_id 二选一。}
      candidate_keyframe_id: {type: string, required: false, description: 候选的 matchedKeyframeId；与 candidate_image 二选一。}

  - name: dedup_tracks
    label: 轨迹去重统计
    description: >-
      在时间范围内按视觉相似度去重，只返回原始轨迹数、高阈值实体数和低阈值实体数。高阈值数为保守上界，低阈值数为合并后的下界。
      省略 time_range 表示全部监控时间。
    arguments:
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]；单日包含整天。"}

  - name: match_entities
    label: 实体先验库匹配统计
    description: >-
      将时间范围内的每条轨迹分别与先验库图片匹配，不做轨迹去重；任一关键帧分数达到阈值即计为在库。
      只向模型返回轨迹总数、在库数和不在库数；匹配 ID、分数及对象留作运行证据。省略 time_range 表示全部监控时间。
    arguments:
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]；单日包含整天。"}

  - name: show_evidence
    label: 证据与统计
    description: >-
      按轨迹汇总本轮证据。界面每条轨迹一行显示 ID、出现时间和该轨迹的第一张关键帧；仅在调用 match_entities 后显示先验库匹配结果。
    arguments:
      track_ids: {type: string_list, required: false, description: 识别结果中的轨迹 ID。}
      time_range: {type: time_range, required: false, description: "可选 ISO-8601 起止时间数组 [start, end]。"}
      max_items: {type: integer, required: false, default: 6, description: 最多展示的轨迹数。}
