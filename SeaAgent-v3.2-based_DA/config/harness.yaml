harness:
  system_prompt_file: harness/system.md
  # 主从协同时主智能体改读这份「规划者」提示词（见 harness/planner.md）
  planner_prompt_file: harness/planner.md
  # 主从协同开关：开启后按 subagents.yaml 装配从智能体，主智能体只保留 master_tools 里的工具。
  # 关掉即退回单智能体（官方语义：禁用 general-purpose 且不传 subagents ⇒ 根本没有 task 工具）。
  subagents_enabled: true
  subagents_file: config/subagents.yaml
  execution_mode: single-agent-harness
  skills_dir: skills
  tools_file: config/tools.yaml
  # 模型轮次不设上限：由模型自己判断何时收尾，收尾动作由 skills/finalize 与证据中间件共同约束。
  # 工具调用上限：run 级管单次问答，thread 级管整段会话。用完后框架会把后续调用一律驳回，
  # 因此还要有失控保护——连续失败到下面这个次数就收尾，避免模型一直刷同一条错误。
  tool_calls_per_run: 40
  tool_calls_per_thread: 400
  stall_guard_consecutive_errors: 4
  # 原地打转保护：同一个「工具 + 参数」重复调用超过这个次数就收尾。
  # 实测弱模型会反复 read_file 同一个技能文件，失败计数抓不到这种「一直成功但没进展」。
  stall_guard_repeat_calls: 3
  summarization_trigger_tokens: 12000
  summarization_keep_messages: 12
  retry_attempts: 2
  retry_delay_seconds: 1.0
  checkpointer: data/memory/checkpoints.sqlite
  stream_mode: updates
  output:
    answer_field: answer
    state_field: state
    evidence_field: evidence
  event_payload_max_chars: 4000
  evidence_tool: show_evidence
  # 收尾守卫：模型给出最终回答却还没落地证据时，最多补发几次提醒（见 harness/wrapup.py）。
  evidence_wrapup_max_nudges: 2
  # 技能披露提醒：整段会话还没读过技能正文时，在模型动手前最多补几句提醒（见 harness/disclosure.py）。
  skill_reminder_max_per_run: 1
  # 文件工具的只读白名单：Deep Agents 原生 skills 渐进式披露要求模型能自行 read_file 打开
  # SKILL.md，因此读取工具必须开放，但读取范围收敛在 skills 目录内（先匹配先生效的权限规则）。
  readonly_paths:
  - /skills
  - /skills/**
  # 仍然禁用的框架自带工具：写入、shell 与子智能体；主智能体只做 ReAct，不落地文件。
  # 注意这里不再列 task：官方的做法是「关掉 general-purpose 且不传 subagents」⇒ 根本不会挂
  # SubAgentMiddleware，也就没有 task 工具；开启主从协同时 task 必须是可用的。
  disabled_deepagent_tools:
  - write_file
  - edit_file
  - delete
  - execute
