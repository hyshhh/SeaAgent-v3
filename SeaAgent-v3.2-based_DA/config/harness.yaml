harness:
  system_prompt_file: harness/system.md
  # 上下文压缩用的摘要提示词（见 harness/summary_prompt.md）：要求摘要逐字保留
  # 时间范围 / 各类 ID / 用户口径 / 待办，否则续接会话时"刚才"就没有所指
  summary_prompt_file: harness/summary_prompt.md
  # 三个独立 Agent 通过版本化共享状态字典协作。
  execution_mode: evidence-state-multi-agent
  subagents_enabled: true
  subagents_file: config/subagents.yaml
  shared_state_file: data/memory/shared_task_state.json
  max_iterations: 4
  skills_dir: skills
  tools_file: config/tools.yaml
  # 模型轮次不设上限：由模型自己判断何时收尾，收尾动作由 skills/finalize 与证据中间件共同约束。
  # 工具调用上限：run 级管单次问答，thread 级管整段会话。用完后框架会把后续调用一律驳回，
  # 因此还要有失控保护——连续失败到下面这个次数就收尾，避免模型一直刷同一条错误。
  tool_calls_per_run: 40
  tool_calls_per_thread: 400
  stall_guard_consecutive_errors: 4
  # 原地打转保护：同一个「工具 + 参数」重复调用超过这个次数就收尾（见 harness/runtime.py）。
  # 主守卫在中间件层（harness/tool_guard.py）——重复调用会被跳过并提示模型；
  # 这里是兜底：模型拿着提示仍不肯换招时，才停掉整轮。
  stall_guard_repeat_calls: 5
  # 每个独立 Agent 的工具调用预算；总预算和迭代预算由 runtime 再兜底。
  subagent_tool_calls: 12
  reconnect_attempts: 2
  reconnect_backoff_seconds: 1.0
  summarization_trigger_tokens: 12000
  summarization_keep_messages: 12
  retry_attempts: 2
  retry_delay_seconds: 1.0
  checkpointer: data/memory/checkpoints.sqlite
  stream_mode: updates
  # 整轮墙钟预算（秒）：运行时只在收到下一帧时才看得到东西，某次工具调用长时间不返回时
  # 前端会彻底静止。超过这个时间接口层就中止等待并给出可读结论；0 表示不设上限。
  # 单次委派的墙钟上限（秒）：从智能体的内部步骤不进主事件流，卡住了外面只能干等。
  # 超过这个间隔没有任何一帧回来，就中止本轮并点名卡在谁身上；0 表示只靠下面的总预算兜底。
  delegation_timeout_seconds: 180
  run_timeout_seconds: 600
  # 心跳：每隔这么多秒发一条「仍在执行」状态，避免看起来像卡死；0 表示关闭。
  heartbeat_seconds: 15
  output:
    answer_field: answer
    state_field: state
    evidence_field: evidence
    # 证据富化载荷的键名（见 harness/evidence.py）：前端证据面板用它一次拿到全部证据 ID
    enriched_evidence_field: enrichedEvidence
  event_payload_max_chars: 4000
  evidence_tool: show_evidence
  # 收尾守卫：模型给出最终回答却还没落地证据时，最多补发几次提醒（见 harness/wrapup.py）。
  evidence_wrapup_max_nudges: 2
  # 技能披露提醒：整段会话还没读过技能正文时，在模型动手前最多补几句提醒（见 harness/disclosure.py）。
  skill_reminder_max_per_run: 1
  # 文件工具的只读白名单：Deep Agents 原生 skills 渐进式披露要求模型能自行 read_file 打开
  # SKILL.md，因此读取工具必须开放，但读取范围收敛在 skills 目录内（先匹配先生效的权限规则）。
  readonly_paths:
  - /skills
  - /skills/**
  # 仍然禁用的框架自带工具：写入、shell、目录探索。
  # ls/glob/grep 一并禁用是事故驱动的：模型拿到探索工具后会拿它去找**数据**（试过 /data、glob /），
  # 而技能目录本来就由提示词给出完整路径，探索工具只剩副作用。
  # read_file 必须留着：原生 skills 渐进式披露要靠它打开 SKILL.md 正文。
  # task 不参与默认三 Agent 协同；每个角色由 runtime 直接调度。
  disabled_deepagent_tools:
  - write_file
  - edit_file
  - delete
  - execute
  - ls
  - glob
  - grep

