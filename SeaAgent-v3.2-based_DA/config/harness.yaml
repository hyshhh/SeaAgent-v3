harness:
  # 上下文压缩用的摘要提示词（见 harness/summary_prompt.md）：要求摘要逐字保留
  # 时间范围 / 各类 ID / 用户口径 / 待办，否则续接会话时"刚才"就没有所指
  summary_prompt_file: harness/summary_prompt.md
  # 三个独立 Agent 通过版本化共享状态字典协作。
  # 当前三阶段编排标识，用于结果投影，不是可切换的运行策略。
  execution_mode: evidence-state-multi-agent
  subagents_file: config/subagents.yaml
  shared_state_file: data/memory/shared_task_state.sqlite
  max_iterations: 4
  # 普通工具串行；仅 VLM 核验允许并发，避免多个 vLLM 请求压满显存。
  vlm_tool_concurrency: 12
  skills_dir: skills
  # 每个角色的模型请求额度、收尾额度、任务提示和技能提醒均在 config/subagents.yaml 中显式声明。
  reconnect_attempts: 2
  reconnect_backoff_seconds: 1.0
  summarization_trigger_tokens: 12000
  summarization_keep_messages: 12
  model_retry_attempts: 2
  retry_delay_seconds: 1.0
  checkpointer: data/memory/checkpoints.sqlite
  stream_mode: updates
  # 心跳：每隔这么多秒发一条「仍在执行」状态，避免看起来像卡死；0 表示关闭。
  heartbeat_seconds: 15
  output:
    answer_field: answer
    state_field: state
    evidence_field: evidence
    # 证据富化载荷的键名（见 harness/evidence.py）：前端证据面板用它一次拿到全部证据 ID
    enriched_evidence_field: enrichedEvidence
  event_payload_max_chars: 4000
  # 文件读取权限按各 Agent 的 skills 目录生成（见 subagents.yaml），写入始终拒绝。
  # 仍然禁用的框架自带工具：写入、shell、目录探索。
  # ls/glob/grep 一并禁用是事故驱动的：模型拿到探索工具后会拿它去找**数据**（试过 /data、glob /），
  # 而技能目录本来就由提示词给出完整路径，探索工具只剩副作用。
  # read_file 必须留着：原生 skills 渐进式披露要靠它打开 SKILL.md 正文。
  disabled_deepagent_tools:
  - write_todos
  - task
  - write_file
  - edit_file
  - delete
  - execute
  - ls
  - glob
  - grep

