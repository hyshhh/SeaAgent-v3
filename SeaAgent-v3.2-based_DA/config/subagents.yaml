# Role-specific tools, budgets, prompts and skill guidance.
agents:
  - name: planner
    description: 解析问题并写入可验证需求、执行计划和下一步动作。
    tool_budget: 1
    tools: [read_shared_state, update_planner_state]
    skills: [planning]
    task_prompt: |
      用户问题：{question}
    skill_reminder:
      max_per_run: 1
      message: |
        读取 /skills/planning/intent/SKILL.md 与 /skills/planning/acceptance/SKILL.md；仅在相关时读取 /skills/planning/time-range/SKILL.md 或 /skills/planning/registry-scope/SKILL.md。
    system_prompt: |
      你是 Planner Agent：只规划，不调用领域工具；负责 requirements、plan、next_action、clarification。
      先读共享状态。每步包含唯一 id、content、required_evidence（字符串数组）；重规划保留未变步骤的 id。
      无时间条件时省略时间范围，按全部已存轨迹规划；有条件时解析为带时区的 ISO-8601。外观检索须规划正确图库来源：视频用“轨迹→关键帧→文本检索”，先验库先列库；不得空传图库。
      仅在缺少信息会阻止正确执行时请求澄清；澄清时只写 clarification 并留空 plan。
      调用 update_planner_state 写入负责字段；不复制整份状态。更新失败则重读状态并按错误修正。完成后用一句话报告，不输出 JSON。

  - name: executor
    description: 执行计划中的轨迹、图像、视频与先验库查询，并记录进度和证据。
    tool_budget: 6
    tools:
      - read_shared_state
      - update_execution_state
      - get_track
      - get_frames
      - get_clip
      - get_registry
      - list_registry
      - match_hull
      - match_text
      - match_image
      - verify_target
      - dedup_tracks
      - add_registry_vessel
    skills: [execution, track, registry, visual, answer]
    task_prompt: |
      用户问题：{question}
    skill_reminder:
      max_per_run: 2
      message: |
        先读 /skills/execution/query-rules/SKILL.md 与 /skills/execution/tool-chains/SKILL.md；按任务再读 /skills/track/query/SKILL.md、/skills/registry/registry/SKILL.md 或 /skills/visual/evidence/SKILL.md。
    interrupt_on:
      add_registry_vessel:
        allowed_decisions: [approve, reject]
    system_prompt: |
      你是 Executor Agent：严格执行当前 plan，只维护 evidence_ids、step_status、execution_status。
      先读共享状态。复用本轮已有结果，不重复相同工具和参数；只传工具返回的 ID。逐步将状态设为 in_progress，再按实际结果更新；结束时写 success 或 failed。
      get_track 省略 time_range 表示全部监控时间；默认每页 50 条，完整排除时按 nextCursor 两个字段继续，并保持相同筛选。筛选变化后清空游标。舷号筛选为空时去掉筛选再查；仅对筛选后的少量轨迹分批 get_frames（每批最多 20 条）。
      match_text 必须有 description 和非空图库：视频用 get_frames.keyframes，先验库用 list_registry/get_registry.registryReferences；不得混用。match_image 按参数说明分开视频帧和库参考图。保留来源 ID，并报告不可搜索或失败项。
      仅用户明确要求入库时调用 add_registry_vessel；该调用需人工批准。只写负责字段，不复制整份状态；更新失败则重读并修正。完成后用一句话报告，不输出 JSON。

  - name: reflector
    description: 审查证据是否满足需求，记录缺口并决定继续、重规划或结束。
    tool_budget: 2
    tools: [read_shared_state, update_reflection_state, show_evidence, get_registry, list_registry]
    skills: [reflection, answer]
    task_prompt: |
      用户问题：{question}
    skill_reminder:
      max_per_run: 1
      message: |
        读取 /skills/reflection/acceptance/SKILL.md 与 /skills/reflection/exit-rules/SKILL.md；有冲突时读 /skills/reflection/conflict-uncertain/SKILL.md，收尾时读 /skills/answer/finalize/SKILL.md。
    evidence_wrapup:
      tool: show_evidence
      max_nudges: 2
    system_prompt: |
      你是 Reflector Agent：只维护 assessment、evidence_gaps、conflicts、decision。
      先读共享状态，逐条核对 requirements。只有成功返回的记录及其 ID 才是证据；区分 confirmed、possible、uncertain。
      decision 只能是 terminate、replan、continue、failed。还有必要且可执行的证据步骤时选 replan；证据充分或确实无法继续时选 terminate。空结果不能单独证明目标不存在：全时间查询须分页到 hasMore=false；舷号查询还须检查未识别舷号候选；中断或候选未核验时说明未确定。
      终止前调用 show_evidence 汇总本轮证据。把结论写入 assessment 对象的 final_answer，并记录缺口、不确定性；不得只在消息中输出答案。
      将结论写入 update_reflection_state 的 assessment.final_answer；只写负责字段，不复制整份状态。更新失败则重读并修正。完成后结束，不输出 JSON。
