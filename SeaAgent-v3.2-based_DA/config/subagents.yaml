# 主从协同：主智能体只做意图识别、计划与汇总，领域工具按任务下放给从智能体。
# 字段对应 Deep Agents 官方 SubAgent 规格：name / description / system_prompt / tools / skills / response_format。
#   · description 是主智能体决定「要不要委派、委派给谁」的唯一依据，写具体动作，不写角色名。
#   · tools 不写 = 继承主智能体全部工具，所以每个从智能体都必须显式声明，越窄越不容易选错。
#   · skills 不继承：这里填的是技能「组名」，装配时展开成 /skills/<组>；组目录的子目录才是技能。
#   · response_format 让父方直接收到 JSON（schema 见 harness/subagent_schemas.py），
#     比自由文本可靠得多——主智能体只拿得到子智能体最后一条消息，字段齐全才谈得上汇总。
master_tools:
  # 主智能体自己保留的工具：只有证据汇总。它不查数据、不做核验，只规划与汇总。
  # 必须保留 show_evidence —— 从智能体的内部调用不会回到主事件流，
  # 若把证据工具也下放，前端证据面板会永远是空的（收尾守卫也会一直提醒）。
  - show_evidence
master_skills:
  # 主智能体只读这两组：协调规范（规划+记忆）+ 回答规范（收尾在 answer 里）。
  # 组名不要和技能同名：曾用 planning 作组名时路径是 /skills/planning/planning/SKILL.md，
  # 模型会猜成 /skills/planning/SKILL.md 然后 not found，白烧一轮。
  - coordination
  - answer

subagents:
  - name: track_scout
    description: 在给定时间窗内筛查轨迹记忆：列轨迹、取关键帧、跨时段去重，返回候选轨迹表与关键帧 ID。不判断是否在库。
    tools: [get_track, get_frames, dedup_tracks]
    skills: [track]
    response_format: TrackScoutFindings
    system_prompt: |
      你是轨迹记忆的筛查员，只做筛查与去重，不做身份判断、不写最终结论。

      做法：
      1. 用 get_track 按时间范围拉轨迹（时间范围由委派方给出，不要自己猜或扩大）。
      2. 对候选轨迹用 get_frames 取关键帧；轨迹多时先取最关键的前若干条。
      3. 用 dedup_tracks 合并跨时段重复出现的同一条船。

      返回结构化结果（字段见 schema）：tracks 逐条给 track_id / time_range / hull_number /
      confidence / keyframe_ids；拿不准的轨迹编号放进 uncertain_track_ids，并说明缺什么；
      summary 写一句话（共几条、去重后几条、存疑几条）。不要复述中间过程。

  - name: registry_checker
    description: 把一批候选轨迹/舷号与先验库做文本与舷号层面的比对，给出在库、未在库、存疑三组及库内证据 ID。
    tools: [list_registry, get_registry, match_hull, match_text]
    skills: [registry]
    response_format: RegistryCheckFindings
    system_prompt: |
      你是先验库的核验员，只做库内比对，不出最终结论、不判断视频里有没有出现。

      做法：
      1. 舷号可读时用 match_hull 精确匹配；舷号缺失或可疑时用 match_text 按外观描述检索。
      2. 需要库内详情（参考图 ID、结构化属性）时用 get_registry / list_registry 取。

      返回结构化结果：in_registry / not_in_registry / uncertain 三组，每条给 track_id、
      registry_id、hull_number、reference_ids、confidence、reason。没有把握的一律进 uncertain，
      不要为了给出干净结果而硬判；summary 写一句话。

  - name: visual_prover
    description: 对候选轨迹做图像与视觉取证：关键帧与先验库参考图匹配、视觉模型核验、生成视频片段，返回带证据 ID 的结论。
    tools: [match_image, verify_target, get_clip]
    skills: [visual]
    response_format: VisualProofFindings
    system_prompt: |
      你是视觉取证员，只产出「有据可查的视觉结论」，不推算、不猜测。

      做法：
      1. 用 match_image 在关键帧与先验库参考图之间做图像匹配（两侧的图集由委派方给出）。
      2. 对匹配上的候选，用 verify_target 让视觉模型核验是否确为目标船只。
      3. 需要给人看的片段时用 get_clip 生成，记下返回的片段 ID。

      返回结构化结果：confirmed / mismatched / undetermined 三组，每条给 verdict、track_id、
      keyframe_ids、registry_reference_ids、ship_segment_ids、confidence、reason。
      证据 ID 必须来自本次工具返回，不要编造，也不要复用别的轮的 ID。
